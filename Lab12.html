<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Information Box</title>
    <link rel="stylesheet" href="Lab12_style.css">
</head>
<body>

    <h2 style="text-align: center;">Our Products</h2>

    <div class="product-container">
        <div class="product-box">
            <img src="https://smartbd.com/wp-content/uploads/2025/11/HP-15-fd0812TU-Core-5-Laptop.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>High-performance for work and play.</p>
            <p class="price">$999.00</p>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>

        <div class="product-box">
            <img src="https://smartbd.com/wp-content/uploads/2025/01/XTREME-X50RG-RGB-GAMING-HEADPHONE.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Noise-canceling wireless sound.</p>
            <p class="price">$199.00</p>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>

        <div class="product-box">
            <img src="https://smartbd.com/wp-content/uploads/2023/05/Realme-Watch-2-Pro-1.jpg" alt="Smartwatch">
            <h3>Smartwatch</h3>
            <p>Track your fitness and time.</p>
            <p class="price">$149.00</p>
            <a href="#" class="buy-btn">Buy Now</a>
        </div>
    </div>

</body>
</html>
