<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimatric Medi-Stock Manager - Registration</title>
    <link rel="stylesheet" href="RegistrationDesign.css">
</head>
<body>

<div class="form-container">
    <h2>Trimatric Medi-Stock Manager<br>Registration Form</h2>

    <form id="registrationForm">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>
            <label>First Name:</label>
            <input type="text" name="first_name">

            <label>Last Name:</label>
            <input type="text" name="last_name">

            <label>Date of Birth (DD/MM/YYYY):</label>
            <input type="date" name="dob">

            <label>Gender:</label>
            <select name="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Religion:</label>
            <input type="text" name="religion">
        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>
            <label>Phone Number:</label>
            <input type="tel" name="phone">

            <label>Email Address (Optional):</label>
            <input type="email" name="email">

            <label>Emergency Contact Number:</label>
            <input type="tel" name="emergency_contact">
        </fieldset>

        <!-- Address Details -->
        <fieldset>
            <legend>Address</legend>
            <label>Street Address:</label>
            <input type="text" name="street">

            <label>City:</label>
            <input type="text" name="city">

            <label>Country:</label>
            <input type="text" name="country">

            <label>Zip Code:</label>
            <input type="text" name="zip">
        </fieldset>

        <!-- Additional Information -->
        <fieldset>
            <legend>Additional Information</legend>
            <label>Profile Picture (Optional):</label>
            <input type="file" name="profile_picture" accept="image/*">

            <div class="checkbox-row">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms" style="margin: 0;">I agree to the Terms and Conditions</label>
            </div>
        </fieldset>

        <!-- Account Information -->
        <fieldset>
            <legend>Account Information</legend>
            <label>Username:</label>
            <input type="text" name="username">

            <label>Password:</label>
            <input type="password" name="password">

            <label>Confirm Password:</label>
            <input type="password" name="confirm_password">
        </fieldset>

        <button type="submit" class="submit-btn">Register</button>

    </form>
</div>

<script src="RegistrationScript.js"></script>
</body>
</html>
