<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Image Slider</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; }
        .slider-container { position: relative; width: 80%; max-width: 800px; margin-top: 50px; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        #main-image { width: 100%; height: 450px; object-fit: cover; display: block; transition: 0.5s ease-in-out; }
        .controls { margin-top: 20px; }
        button { padding: 10px 25px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; margin: 0 10px; transition: 0.3s; }
    </style>
</head>
<body>

    <h1>Explore the World</h1>
    
    <div class="slider-container">
        <img id="main-image" src="" alt="Travel Destination">
    </div>

    <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
    </div>

    <script src="Lab15_Script.js"></script>
</body>
</html>
