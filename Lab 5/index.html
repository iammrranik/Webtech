<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anik's University Online Admission</title>
</head>
<body>
    <h1>Anik's University Online Admission Form</h1>
    <form action="">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="32" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" maxlength="15" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
            <br><br>

            <label for="Interest">Interest:</label>
            <input type="checkbox" name="reading" id="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" name="gaming" id="gaming">
            <label for="gaming">Gaming</label>
            <input type="checkbox" name="gardening" id="gardening">
            <label for="gardening">Gardening</label>
        </fieldset>
        <fieldset>
            <legend>Course Selection</legend>
            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select a course--</option>
                <option value="cse">Computer Science and Engineering</option>
                <option value="eee">Electrical and Electronic Engineering</option>
                <option value="bba">Bachelor of Business Administration</option>
                <option value="english">English Literature</option>
            </select>
            <br><br>
            <label for="select-date">Select Date:</label>
            <input type="date" name="select-date" id="select-date">
        </fieldset>
        <fieldset>
            <legend>Upload Documents</legend>
            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required><br><br>
        </fieldset>
    </form>
</body>
</html>
